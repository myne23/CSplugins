name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Test Maven repositories
        run: |
          HOST=repo.maven.apache.org
          curl -I "https://${HOST}/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.4.0/kotlin-gradle-plugin-2.4.0.pom"
          curl -I "https://${HOST}/maven2/org/apache/httpcomponents/httpmime/4.5.6/httpmime-4.5.6.pom"
          curl -I "https://${HOST}/maven2/commons-io/commons-io/2.13.0/commons-io-2.13.0.pom"

      - name: Fix CloudStream Gradle plugin version
        run: |
          cd $GITHUB_WORKSPACE/src
          sed -i 's/com\.github\.recloudstream:gradle:-SNAPSHOT/com.github.recloudstream:gradle:32895aedb6366f5075cb99bbd2e6ce0a7cac325d/' build.gradle.kts
          grep 'recloudstream:gradle' build.gradle.kts

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
