name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare CloudStream Gradle plugin
        run: |
          cd $GITHUB_WORKSPACE/src

          curl -fL \
            "https://jitpack.io/com/github/recloudstream/gradle/gradle/-32895aedb6-1/gradle--32895aedb6-1.jar" \
            -o "$GITHUB_WORKSPACE/recloudstream-gradle.jar"

          echo "CloudStream Gradle plugin:"
          sha256sum "$GITHUB_WORKSPACE/recloudstream-gradle.jar"

          test "$(sha256sum "$GITHUB_WORKSPACE/recloudstream-gradle.jar" | cut -d' ' -f1)" = "5358ef5bfe9ea8fad162fe9c4895e5706a92659c34a38bbd91457d902fadcb21"

          sed -i \
            "s|classpath(\"com.github.recloudstream:gradle:-SNAPSHOT\")|classpath(files(\"$GITHUB_WORKSPACE/recloudstream-gradle.jar\"))|" \
            build.gradle.kts

          echo "Gradle plugin configuration:"
          grep 'recloudstream:gradle\|recloudstream-gradle.jar' build.gradle.kts

      - name: Test Maven repositories
        run: |
          HOST=repo.maven.apache.org
          curl -I "https://${HOST}/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.4.0/kotlin-gradle-plugin-2.4.0.pom"
          curl -I "https://${HOST}/maven2/org/apache/httpcomponents/httpmime/4.5.6/httpmime-4.5.6.pom"
          curl -I "https://${HOST}/maven2/commons-io/commons-io/2.13.0/commons-io-2.13.0.pom"

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
