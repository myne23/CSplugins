name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Test Maven repositories
        run: |
          HOST=repo.maven.apache.org
          curl -I "https://${HOST}/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.4.0/kotlin-gradle-plugin-2.4.0.pom"
          curl -I "https://${HOST}/maven2/org/apache/httpcomponents/httpmime/4.5.6/httpmime-4.5.6.pom"
          curl -I "https://${HOST}/maven2/commons-io/commons-io/2.13.0/commons-io-2.13.0.pom"

      - name: Prepare CloudStream Gradle plugin
        run: |
          mkdir -p $HOME/.gradle/init.d
          curl -fL \
            "https://jitpack.io/com/github/recloudstream/gradle/-SNAPSHOT/gradle--32895aedb6-1.jar" \
            -o "$HOME/.gradle/recloudstream-gradle.jar"

          cat > $HOME/.gradle/init.d/recloudstream.gradle.kts <<'GRADLE'
          allprojects {
              buildscript {
                  configurations.classpath {
                      resolutionStrategy.eachDependency {
                          if (requested.group == "com.github.recloudstream" &&
                              requested.name == "gradle") {
                              useModule("com.github.recloudstream:gradle:32895aedb6-1")
                          }
                      }
                  }
              }
          }
          GRADLE

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
